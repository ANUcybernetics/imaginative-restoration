[tools]
erlang = "28.1.1"
elixir = "1.19.5-otp-28"
sqlite = "latest"

[env]
AWS_ENDPOINT_URL_S3 = "https://fly.storage.tigris.dev"
AWS_REGION = "auto"
# AUTH_USERNAME and AUTH_PASSWORD live in mise.local.toml (gitignored).
# Real prod creds are set as Fly secrets.

# Secrets (REPLICATE_API_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# come from the untracked [env] block in ~/.config/mise/config.local.toml.
